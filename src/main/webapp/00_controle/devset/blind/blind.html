<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Controle Bling</title>

    <!-- Bootstrap 5.3.2 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background-color: #f5f6f8;
        }

        .card-blind {
            max-width: 1000px;
            margin: 30px auto;
        }

        .titulo {
            font-weight: 600;
        }

        #resultado {
            min-height: 120px;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            padding: 15px;
            white-space: pre-wrap;
        }

    </style>

</head>

<body>

<div class="container-fluid">

    <div class="card shadow-sm card-blind">

        <!-- CABEÇALHO -->
        <div class="card-header bg-white">

            <div class="d-flex
                        justify-content-between
                        align-items-center">

                <div>

                    <h5 class="titulo mb-0">
                        Controle Bling
                    </h5>

                    <small class="text-muted">
                        Integração com o Bling
                    </small>

                </div>

                <!-- ABRIR BLING -->
                <button
                    type="button"
                    class="btn btn-primary"
                    onclick="abrirBling()">

                    Abrir Bling

                </button>

            </div>

        </div>


        <!-- CORPO -->
        <div class="card-body">

            <!-- ORDEM DE SERVIÇO -->
            <h6 class="mb-3">
                Ordem de Serviço
            </h6>


            <div class="row g-3">

                <!-- NÚMERO OS -->
                <div class="col-12 col-md-4">

                    <label
                        for="numeroOS"
                        class="form-label">

                        Número da OS

                    </label>

                    <div class="input-group">

                        <input
                            type="text"
                            id="numeroOS"
                            name="numeroOS"
                            class="form-control"
                            placeholder="Digite o número da OS">

                        <button
                            type="button"
                            class="btn btn-secondary"
                            onclick="buscarOS()">

                            Buscar

                        </button>

                    </div>

                </div>


                <!-- ID DA OS -->
                <div class="col-12 col-md-4">

                    <label
                        for="idOS"
                        class="form-label">

                        ID da OS no Bling

                    </label>

                    <input
                        type="text"
                        id="idOS"
                        name="idOS"
                        class="form-control"
                        readonly>

                </div>


                <!-- SITUAÇÃO -->
                <div class="col-12 col-md-4">

                    <label
                        for="situacao"
                        class="form-label">

                        Situação

                    </label>

                    <input
                        type="text"
                        id="situacao"
                        name="situacao"
                        class="form-control"
                        readonly>

                </div>


                <!-- CLIENTE -->
                <div class="col-12 col-md-6">

                    <label
                        for="cliente"
                        class="form-label">

                        Cliente

                    </label>

                    <input
                        type="text"
                        id="cliente"
                        name="cliente"
                        class="form-control"
                        readonly>

                </div>


                <!-- CNPJ -->
                <div class="col-12 col-md-6">

                    <label
                        for="cnpj"
                        class="form-label">

                        CNPJ / CPF

                    </label>

                    <input
                        type="text"
                        id="cnpj"
                        name="cnpj"
                        class="form-control"
                        readonly>

                </div>


                <!-- EQUIPAMENTO -->
                <div class="col-12">

                    <label
                        for="equipamento"
                        class="form-label">

                        Equipamento

                    </label>

                    <textarea
                        id="equipamento"
                        name="equipamento"
                        class="form-control"
                        rows="3"
                        placeholder="Digite o equipamento"></textarea>

                </div>

            </div>


            <hr class="my-4">


            <!-- COMANDOS -->
            <h6 class="mb-3">
                Comandos
            </h6>

            <div class="d-flex
                        flex-wrap
                        gap-2">

                <button
                    type="button"
                    class="btn btn-primary"
                    onclick="buscarOS()">

                    Buscar OS

                </button>


                <button
                    type="button"
                    class="btn btn-success"
                    onclick="salvarOS()">

                    Salvar Equipamento

                </button>


                <button
                    type="button"
                    class="btn btn-warning"
                    onclick="limparTela()">

                    Limpar

                </button>

            </div>


            <hr class="my-4">


            <!-- RETORNO -->
            <h6 class="mb-3">
                Retorno
            </h6>

            <div id="resultado">

                Aguardando comando...

            </div>

        </div>

    </div>

</div>


<!-- Bootstrap JS -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>


<script>

/*
 * =========================================================
 * ABRIR BLING
 * =========================================================
 */

function abrirBling() {

    window.open(
        "https://www.bling.com.br/b/inicio#/",
        "bling"
    );

}


/*
 * =========================================================
 * BUSCAR OS
 * =========================================================
 *
 * Por enquanto está somente preparado.
 *
 * Depois vamos colocar:
 *
 * blind.html
 *      ↓
 * Servlet Java
 *      ↓
 * API Bling
 */

 /*
  * =========================================================
  * BUSCAR OS
  * =========================================================
  */
 async function buscarOS() {
     const numeroOS = document.getElementById("numeroOS").value.trim();

     if (numeroOS === "") {
         mostrarResultado("⚠️ Digite o número da OS.");
         return;
     }

     mostrarResultado("⏳ Consultando OS " + numeroOS + " no Bling...");

     try {
         const resposta = await fetch(
             "/setoue/bling/api?func=buscarOS&numero=" + encodeURIComponent(numeroOS),
             {
                 method: "GET",
                 headers: {
                     "Accept": "application/json"
                 }
             }
         );

         const dados = await resposta.json();

         if (!resposta.ok) {
             console.error(dados);
             mostrarResultado("❌ Erro ao consultar a OS.\n\n" + JSON.stringify(dados, null, 2));
             return;
         }

         // A API v3 retorna um array em "data" quando fazemos busca com filtro
         if (dados.data && dados.data.length > 0) {
             const os = dados.data[0]; // Pega a primeira OS encontrada

             // 1. ID da OS
             document.getElementById("idOS").value = os.id || "";

             // 2. Número da OS
             document.getElementById("numeroOS").value = os.numero || numeroOS;

             // 3. Situação
             if (os.situacao && os.situacao.nome) {
                 document.getElementById("situacao").value = os.situacao.nome;
             }

             // 4. Cliente
             if (os.cliente && os.cliente.nome) {
                 document.getElementById("cliente").value = os.cliente.nome;
             }

             // 5. CNPJ / CPF (Na v3 do Bling, fica em "numero_documento" dentro de cliente)
             if (os.cliente && os.cliente.numero_documento) {
                 document.getElementById("cnpj").value = os.cliente.numero_documento;
             }

             // 6. Equipamento (Geralmente vem nos "itens" ou "servicos" da OS)
             let descEquipamento = "Não informado";
             if (os.itens && os.itens.length > 0) {
                 // Pega a descrição do primeiro item como exemplo
                 descEquipamento = os.itens[0].descricao || "Sem descrição";
             } else if (os.servicos && os.servicos.length > 0) {
                 descEquipamento = os.servicos[0].descricao || "Sem descrição";
             }
             document.getElementById("equipamento").value = descEquipamento;

             mostrarResultado("✅ OS encontrada com sucesso!\n\n" + JSON.stringify(dados, null, 2));

         } else {
             mostrarResultado("⚠️ Nenhuma OS encontrada com o número: " + numeroOS);
         }

     } catch (erro) {
         console.error(erro);
         mostrarResultado("❌ Erro de comunicação com o servidor.\n\n" + erro.message);
     }
 }

/*
 * =========================================================
 * SALVAR EQUIPAMENTO
 * =========================================================
 */

function salvarOS() {

    const idOS =
        document.getElementById("idOS").value.trim();

    const equipamento =
        document.getElementById("equipamento").value.trim();


    if (idOS === "") {

        mostrarResultado(
            "Primeiro faça a busca da OS."
        );

        return;
    }


    if (equipamento === "") {

        mostrarResultado(
            "Digite o equipamento."
        );

        return;
    }


    mostrarResultado(
        "Preparando atualização da OS..."
    );


    /*
     * Depois:
     *
     * Java recebe:
     *
     * idOS
     * equipamento
     *
     * e atualiza a OS existente no Bling.
     */

}


/*
 * =========================================================
 * LIMPAR
 * =========================================================
 */

function limparTela() {

    document.getElementById("numeroOS").value = "";

    document.getElementById("idOS").value = "";

    document.getElementById("situacao").value = "";

    document.getElementById("cliente").value = "";

    document.getElementById("cnpj").value = "";

    document.getElementById("equipamento").value = "";

    document.getElementById("resultado").textContent =
        "Aguardando comando...";

}


/*
 * =========================================================
 * RETORNO
 * =========================================================
 */

function mostrarResultado(mensagem) {

    document.getElementById("resultado")
        .textContent = mensagem;

}

</script>


</body>

</html>
